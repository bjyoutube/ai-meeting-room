<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>모바일 미리보기 (임시)</title>
<style>
  html, body { margin: 0; height: 100%; background: #20242a; display: grid; place-items: center; }
  .phone { width: 390px; height: 844px; border-radius: 36px; overflow: hidden; background: #000;
           box-shadow: 0 24px 70px rgba(0,0,0,.65), 0 0 0 10px #14171b, 0 0 0 11px #2b3037; }
  iframe { width: 390px; height: 844px; border: 0; display: block; }
</style>
</head>
<body>
  <div class="phone"><iframe id="f" src="./index.html?mobile=1" title="AI 소통창 모바일 미리보기"></iframe></div>
  <script>
    document.getElementById('f').src = './index.html' + (location.search || '');
  </script>
</body>
</html>
