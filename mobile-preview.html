<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mobile preview (임시 파일)</title>
<style>
  html, body { margin: 0; padding: 0; background: #0f172a; }
  iframe { display: block; width: 390px; height: 844px; border: 0; background: #fff; }
</style>
</head>
<body>
<iframe id="f" src="./index.html" title="mobile preview"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  try {
    var w = this.contentWindow;
    var dash = w.document.getElementById('dash');
    var btn = w.document.getElementById('dashBtn');
    if (dash && btn && dash.classList.contains('collapsed')) btn.click();
  } catch (e) { /* same-origin only */ }
});
</script>
</body>
</html>
